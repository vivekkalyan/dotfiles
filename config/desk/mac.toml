# The desk services this Mac has, linked to ~/.config/desk/config.toml. Each table enables one
# service; desk lists it once its keys are also in ~/workspace/.env.

# Brain vault helpers (people resolution and Google Calendar daily/meeting sync).
[brain]

# Dedicated Helium browser session over CDP (~/.local/share/agents/helium-agents).
[browser]

# Confluence Cloud with an Atlassian API token (CONFLUENCE_EMAIL, CONFLUENCE_API_TOKEN).
[confluence]
base_url = "https://coreweave.atlassian.net/wiki"

# Google Calendar through the dedicated browser session.
[gcal]

# Gmail through the dedicated browser session.
[gmail]

# Slack (read-only) with a session captured from the dedicated browser (desk slack auth refresh).
[slack]

# Brain tasks (efforts/tasks/), local filesystem service with zero API keys.
[task]

# Telegram Saved Messages (read-only), kept on the Mac with its local MTProto session.
[telegram]

# Personal tasks, tried on the Mac first.
[todoist]

# Meeting transcripts from Zoom (via Gmail + Helium) and local Meetily folders.
[transcripts]

# YouTube metadata, timestamped transcripts, frames, and local whisper.cpp ASR.
[youtube]
